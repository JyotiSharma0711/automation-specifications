  on_search:
    - _NAME_: ON_SEARCH_CONTEXT
      action:
        - on_search
      domain:
        - ONDC:FIS12
      version:
        - 2.2.1
      _RETURN_: *a1
    - _NAME_: ON_SEARCH_CATALOG_NAME
      attr: $.message.catalog.descriptor.name
      _RETURN_: attr are present
    - _NAME_: ON_SEARCH_CATEGORIES
      _RETURN_:
        - _NAME_: REQUIRED_CATEGORIES_NAME
          attr: $.message.catalog.providers[*].categories[*].descriptor.name
          _RETURN_: attr are present
        - _NAME_: REQUIRED_CATEGORIES_CODE
          attr: $.message.catalog.providers[*].categories[*].descriptor.code
          _RETURN_: attr are present
        - _NAME_: VALID_ENUM_CATEGORIES_CODE
          attr: $.message.catalog.providers[*].categories[*].descriptor.code
          enumList:
            - PURCHASE_FINANCE
            - AGRI_PURCHASE_FINANCE
            - ELECTRONICS_PURCHASE_FINANCE
          _RETURN_: attr all in enumList
        - _NAME_: REQUIRED_CATEGORIES_ID
          attr: $.message.catalog.providers[*].categories[*].id
          _RETURN_: attr are present
        - _NAME_: REQUIRED_CATEGORIES_PARENT_ID
          attr: $.message.catalog.providers[*].categories[*].parent_category_id
          category_code_path: $.message.catalog.providers[*].categories[*].descriptor.code
          var_category_code:
            - AGRI_PURCHASE_FINANCE
            - ELECTRONICS_PURCHASE_FINANCE
          _CONTINUE_: (var_category_code any in category_code_path)
          _RETURN_: attr are present
    - _NAME_: ON_SEARCH_PROVIDER
      _RETURN_:
        - _NAME_: REQUIRED_PROVIDER_ID
          attr: $.message.catalog.providers[*].id
          _RETURN_: attr are present
        - _NAME_: REQUIRED_PROVIDER_NAME
          attr: $.message.catalog.providers[*].descriptor.name
          _RETURN_: attr are present
        - _NAME_: REQUIRED_PROVIDER_IMAGES_URL
          attr: $.message.catalog.providers[*].descriptor.images[*].url
          _RETURN_: attr are present
        - _NAME_: REQUIRED_PROVIDER_IMAGES_SIZE_TYPE
          attr: $.message.catalog.providers[*].descriptor.images[*].size_type
          _RETURN_: attr are present
        - _NAME_: VALID_PROVIDER_IMAGES_SIZE_TYPE
          attr: $.message.catalog.providers[*].descriptor.images[*].size_type
          enumList:
            - xs
            - sm
            - md
            - lg
          _RETURN_: attr all in enumList
    - _NAME_: ON_SEARCH_PROVIDER_CONTACT_INFO
      _RETURN_:
        - _NAME_: REQUIRED_CONTACT_INFO_TAG_GROUP
          validTags: &a3
            - CONTACT_INFO
          tagPath: $.message.catalog.providers[*].tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_CONTACT_INFO_LIST
          _SCOPE_: $.message.catalog.providers[*].tags[?(@.descriptor.code=='CONTACT_INFO')]
          subTags: $.list[*].descriptor.code
          validValues: &a4
            - GRO_NAME
            - GRO_EMAIL
            - GRO_CONTACT_NUMBER
            - CUSTOMER_SUPPORT_LINK
            - CUSTOMER_SUPPORT_CONTACT_NUMBER
            - CUSTOMER_SUPPORT_EMAIL
          _CONTINUE_: "!(subTags are present)"
          _RETURN_: subTags all in validValues
    - _NAME_: ON_SEARCH_PROVIDER_LSP_INFO
      _RETURN_:
        - _NAME_: REQUIRED_LSP_INFO_TAG_GROUP
          validTags: &a5
            - LSP_INFO
          tagPath: $.message.catalog.providers[*].tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_LSP_INFO_LIST
          _SCOPE_: $.message.catalog.providers[*].tags[?(@.descriptor.code=='LSP_INFO')]
          subTags: $.list[*].descriptor.code
          validValues: &a6
            - LSP_NAME
            - LSP_EMAIL
            - LSP_CONTACT_NUMBER
            - LSP_ADDRESS
          _CONTINUE_: "!(subTags are present)"
          _RETURN_: subTags all in validValues
    - _NAME_: ON_SEARCH_PAYMENT
      _RETURN_:
        - _NAME_: REQUIRED_PAYMENT_COLLECTED_BY
          attr: $.message.catalog.providers[*].payments[*].collected_by
          _RETURN_: attr are present
        - _NAME_: VALID_PAYMENT_COLLECTED_BY_ENUM
          attr: $.message.catalog.providers[*].payments[*].collected_by
          enumList: *a2
          _RETURN_: attr all in enumList
        - _NAME_: REQUIRED_BPP_TERMS_TAG
          validTags: &a12
            - BPP_TERMS
          tagPath: $.message.catalog.providers[*].payments[*].tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_BPP_TERMS_LIST
          _SCOPE_: $.message.catalog.providers[*].payments[*].tags[?(@.descriptor.code=='BPP_TERMS')]
          subTags: $.list[*].descriptor.code
          validValues:
            - BUYER_FINDER_FEES_TYPE
            - BUYER_FINDER_FEES_PERCENTAGE
            - SETTLEMENT_WINDOW
            - SETTLEMENT_BASIS
            - MANDATORY_ARBITRATION
            - COURT_JURISDICTION
            - STATIC_TERMS
            - OFFLINE_CONTRACT
          _CONTINUE_: "!(subTags are present)"
          _RETURN_: subTags all in validValues
        - _NAME_: VALID_BUYER_FINDER_FEES_TYPE_VALUE
          _SCOPE_: $.message.catalog.providers[*].payments[*].tags[?(@.descriptor.code=='BPP_TERMS')].list[?(@.descriptor.code=='BUYER_FINDER_FEES_TYPE')]
          attr: $.value
          enumList:
            - percent-annualized
          _RETURN_: attr all in enumList
        - _NAME_: VALID_SETTLEMENT_BASIS_VALUE
          _SCOPE_: $.message.catalog.providers[*].payments[*].tags[?(@.descriptor.code=='BPP_TERMS')].list[?(@.descriptor.code=='SETTLEMENT_BASIS')]
          attr: $.value
          enumList:
            - INVOICE_RECEIPT
            - DELIVERY
          _RETURN_: attr all in enumList
    - _NAME_: ON_SEARCH_ITEMS
      usecasepath: $.message.catalog.providers[*].items[*].id
      _CONTINUE_: "!(usecasepath are present)"
      _RETURN_:
        - _NAME_: REQUIRED_ITEM_ID
          attr: $.message.catalog.providers[*].items[*].id
          _RETURN_: attr are present
        - _NAME_: REQUIRED_ITEM_CATEGORY_IDS
          attr: $.message.catalog.providers[*].items[*].category_ids[*]
          _RETURN_: attr are present
        - _NAME_: REQUIRED_ITEM_DESCRIPTOR_CODE
          attr: $.message.catalog.providers[*].items[*].descriptor.code
          _RETURN_: attr are present
        - _NAME_: VALID_ITEM_DESCRIPTOR_CODE
          attr: $.message.catalog.providers[*].items[*].descriptor.code
          enumList: &a7
            - LOAN
          _RETURN_: attr all in enumList
        - _NAME_: REQUIRED_ITEM_DESCRIPTOR_NAME
          attr: $.message.catalog.providers[*].items[*].descriptor.name
          _RETURN_: attr are present
  select:
    - _NAME_: SELECT_CONTEXT
      action:
        - select
      domain:
        - ONDC:FIS12
      version:
        - 2.2.1
      _RETURN_: *a1
    - _NAME_: SELECT_PROVIDER_ID
      attr: $.message.order.provider.id
      _RETURN_: attr are present
    - _NAME_: SELECT_ITEMS
      _RETURN_:
        - _NAME_: REQUIRED_ITEM_ID
          attr: $.message.order.items[*].id
          _RETURN_: attr are present
  on_select:
    - _NAME_: ON_SELECT_CONTEXT
      action:
        - on_select
      domain:
        - ONDC:FIS12
      version:
        - 2.2.1
      _RETURN_: *a1
    - _NAME_: ON_SELECT_PROVIDER
      _RETURN_:
        - _NAME_: REQUIRED_PROVIDER_ID
          attr: $.message.order.provider.id
          _RETURN_: attr are present
        - _NAME_: REQUIRED_PROVIDER_NAME
          attr: $.message.order.provider.descriptor.name
          _RETURN_: attr are present
    - _NAME_: ON_SELECT_PROVIDER_TAGS
      _RETURN_:
        - _NAME_: REQUIRED_CONTACT_INFO_TAG_GROUP
          validTags: *a3
          tagPath: $.message.order.provider.tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_CONTACT_INFO_LIST
          _SCOPE_: $.message.order.provider.tags[?(@.descriptor.code=='CONTACT_INFO')]
          subTags: $.list[*].descriptor.code
          validValues: *a4
          _CONTINUE_: "!(subTags are present)"
          _RETURN_: subTags all in validValues
        - _NAME_: REQUIRED_LSP_INFO_TAG_GROUP
          validTags: *a5
          tagPath: $.message.order.provider.tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_LSP_INFO_LIST
          _SCOPE_: $.message.order.provider.tags[?(@.descriptor.code=='LSP_INFO')]
          subTags: $.list[*].descriptor.code
          validValues: *a6
          _CONTINUE_: "!(subTags are present)"
          _RETURN_: subTags all in validValues
    - _NAME_: ON_SELECT_ITEMS_BASIC
      _RETURN_:
        - _NAME_: REQUIRED_ITEM_ID
          attr: $.message.order.items[*].id
          _RETURN_: attr are present
        - _NAME_: REQUIRED_ITEM_DESCRIPTOR_CODE
          attr: $.message.order.items[*].descriptor.code
          _RETURN_: attr are present
        - _NAME_: VALID_ITEM_DESCRIPTOR_CODE_ENUM
          attr: $.message.order.items[*].descriptor.code
          enumList: *a7
          _RETURN_: attr all in enumList
        - _NAME_: REQUIRED_ITEM_DESCRIPTOR_NAME
          attr: $.message.order.items[*].descriptor.name
          _RETURN_: attr are present
        - _NAME_: REQUIRED_ITEM_CATEGORY_IDS
          attr: $.message.order.items[*].category_ids[*]
          _RETURN_: attr are present
        - _NAME_: REQUIRED_ITEM_PRICE
          attr: $.message.order.items[*].price.value
          _RETURN_: attr are present
        - _NAME_: REQUIRED_ITEM_PRICE_CURRENCY
          attr: $.message.order.items[*].price.currency
          enumList: &a8
            - INR
          _RETURN_: attr all in enumList
    - _NAME_: ON_SELECT_ITEMS_INFO_TAG
      _RETURN_:
        - _NAME_: REQUIRED_INFO_TAG_GROUP
          validTags: &a10
            - INFO
          tagPath: $.message.order.items[*].tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_INFO_LIST
          _SCOPE_: $.message.order.items[*].tags[?(@.descriptor.code=='INFO')]
          subTags: $.list[*].descriptor.code
          validValues:
            - INTEREST_RATE
            - TERM
            - INTEREST_RATE_TYPE
            - APPLICATION_FEE
            - FORECLOSURE_FEE
            - INTEREST_RATE_CONVERSION_CHARGE
            - DELAY_PENALTY_FEE
            - OTHER_PENALTY_FEE
            - ANNUAL_PERCENTAGE_RATE
            - REPAYMENT_FREQUENCY
            - NUMBER_OF_INSTALLMENTS
            - TNC_LINK
            - COOL_OFF_PERIOD
            - INSTALLMENT_AMOUNT
            - MINIMUM_DOWNPAYMENT
            - SUBVENTION_RATE
            - SELLER_SUBVENTION_RATE
          _CONTINUE_: "!(subTags are present)"
          _RETURN_: subTags any in validValues
        - _NAME_: VALID_INTEREST_RATE_TYPE
          _SCOPE_: $.message.order.items[*].tags[?(@.descriptor.code=='INFO')].list[?(@.descriptor.code=='INTEREST_RATE_TYPE')]
          attr: $.value
          enumList:
            - FIXED
            - FLOATING
          _RETURN_: attr all in enumList
    - _NAME_: ON_SELECT_ITEMS_CHECKLISTS_TAG
      _RETURN_:
        - _NAME_: REQUIRED_CHECKLISTS_TAG_GROUP
          validTags: &a11
            - CHECKLISTS
          tagPath: $.message.order.items[*].tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_CHECKLISTS_LIST
          _SCOPE_: $.message.order.items[*].tags[?(@.descriptor.code=='CHECKLISTS')]
          subTags: $.list[*].descriptor.code
          validValues:
            - SET_DOWN_PAYMENT
            - KYC
            - EMANDATE
            - ESIGN
            - KYC_ENACH_ESIGN
          _CONTINUE_: "!(subTags are present)"
          _RETURN_: subTags any in validValues
        - _NAME_: VALID_CHECKLIST_STATUS_VALUES
          _SCOPE_: $.message.order.items[*].tags[?(@.descriptor.code=='CHECKLISTS')].list[*]
          attr: $.value
          enumList:
            - PENDING
            - COMPLETED
          _RETURN_: attr all in enumList
    - _NAME_: ON_SELECT_QUOTE
      _RETURN_:
        - _NAME_: REQUIRED_QUOTE_ID
          attr: $.message.order.quote.id
          _RETURN_: attr are present
        - _NAME_: REQUIRED_QUOTE_PRICE
          _RETURN_:
            - _NAME_: REQUIRED_QUOTE_PRICE_VALUE
              attr: $.message.order.quote.price.value
              _RETURN_: attr are present
            - _NAME_: REQUIRED_QUOTE_PRICE_CURRENCY
              attr: $.message.order.quote.price.currency
              enumList: *a8
              _RETURN_: attr all in enumList
        - _NAME_: REQUIRED_QUOTE_BREAKUP
          _RETURN_:
            - _NAME_: REQUIRED_QUOTE_BREAKUP_TITLE
              attr: $.message.order.quote.breakup[*].title
              _RETURN_: attr are present
            - _NAME_: VALID_QUOTE_BREAKUP_TITLE_ENUM
              attr: $.message.order.quote.breakup[*].title
              enumList: &a13
                - PRINCIPAL_AMOUNT
                - INTEREST_AMOUNT
                - PROCESSING_FEE
                - OTHER_UPFRONT_CHARGES
                - INSURANCE_CHARGES
                - NET_DISBURSED_AMOUNT
                - OTHER_CHARGES
              _RETURN_: attr any in enumList
            - _NAME_: REQUIRED_QUOTE_BREAKUP_PRICE
              attr: $.message.order.quote.breakup[*].price.value
              _RETURN_: attr are present
            - _NAME_: REQUIRED_QUOTE_BREAKUP_PRICE_CURRENCY
              attr: $.message.order.quote.breakup[*].price.currency
              enumList: *a8
              _RETURN_: attr all in enumList
        - _NAME_: REQUIRED_QUOTE_TTL
          attr: $.message.order.quote.ttl
          _RETURN_: attr are present
        - _NAME_: VALID_QUOTE_TTL_REGEX
          attr: $.message.order.quote.ttl
          reg:
            - ^P(?:(\\d+Y)?(\\d+M)?(\\d+D)?(T(\\d+H)?(\\d+M)?(\\d+S)?)?|T\\d+D)$
          _RETURN_: attr follow regex reg
  init:
    - _NAME_: INIT_CONTEXT
      action:
        - init
      domain:
        - ONDC:FIS12
      version:
        - 2.2.1
      _RETURN_: *a1
    - _NAME_: INIT_PROVIDER_ID
      attr: $.message.order.provider.id
      _RETURN_: attr are present
    - _NAME_: INIT_ITEMS
      _RETURN_:
        - _NAME_: REQUIRED_ITEM_ID
          attr: $.message.order.items[*].id
          _RETURN_: attr are present
    - _NAME_: INIT_PAYMENTS
      _RETURN_:
        - _NAME_: REQUIRED_PAYMENT_COLLECTED_BY
          attr: $.message.order.payments[*].collected_by
          _RETURN_: attr are present
        - _NAME_: REQUIRED_PAYMENT_TYPE
          attr: $.message.order.payments[*].type
          _RETURN_: attr are present
        - _NAME_: VALID_PAYMENT_TYPE_ENUM
          attr: $.message.order.payments[*].type
          enumList:
            - ON_ORDER
            - PRE_ORDER
            - POST_FULFILLMENT
          _RETURN_: attr all in enumList
        - _NAME_: REQUIRED_PAYMENT_STATUS
          attr: $.message.order.payments[*].status
          _RETURN_: attr are present
        - _NAME_: VALID_PAYMENT_STATUS_ENUM
          attr: $.message.order.payments[*].status
          enumList:
            - NOT-PAID
            - PAID
          _RETURN_: attr all in enumList
    - _NAME_: INIT_PAYMENTS_PARAMS
      _SCOPE_: $.message.order.payments[?(@.type=='ON_ORDER')]
      _RETURN_:
        - _NAME_: REQUIRED_PAYMENT_PARAMS_BANK_CODE
          attr: $.message.order.payments[?(@.type=='ON_ORDER')].params.bank_code
          _RETURN_: attr are present
        - _NAME_: REQUIRED_PAYMENT_PARAMS_BANK_ACCOUNT
          attr: $.message.order.payments[?(@.type=='ON_ORDER')].params.bank_account_number
          _RETURN_: attr are present
        - _NAME_: REQUIRED_PAYMENT_PARAMS_VPA
          attr: $.message.order.payments[?(@.type=='ON_ORDER')].params.virtual_payment_address
          _RETURN_: attr are present
    - _NAME_: INIT_PAYMENT_TAGS
      _RETURN_:
        - _NAME_: REQUIRED_BAP_TERMS_TAG
          validTags: *a9
          tagPath: $.message.order.payments[*].tags[*].descriptor.code
          _RETURN_: tagPath any in validTags
        - _NAME_: REQUIRED_BAP_TERMS_LIST
          _SCOPE_: $.message.order.payments[*].tags[?(@.descriptor.code=='BAP_TERMS')]
