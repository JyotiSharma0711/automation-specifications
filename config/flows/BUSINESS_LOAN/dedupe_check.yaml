steps:
  - api: select
    action_id: select_1
    owner: BAP
    responseFor: null
    unsolicited: false
    description: The borrower selects the dedupe item.
    mock:
      generate: 
      validate: 
      requirements: 
      defaultPayload:
        context:
          domain: ONDC:FIS12:BL
          action: select
          timestamp: 2026-06-28T23:49:50.140Z
          transaction_id: 97c8aa10-3357-4514-ae11-6bf97a72b677
          message_id: a2a7361e-126a-478b-9752-b33afc00039f
          bap_id: bap.example.com
          bap_uri: https://bap.example.com
          ttl: PT10M
          bpp_id: bpp.example.com
          bpp_uri: https://bpp.example.com
          version: 2.3.0
          location:
            country:
              code: IND
            city:
              code: "*"
        message: {}
      saveData:
        transactionId: $.context.transaction_id
        latestMessage_id: $.context.message_id
        latestTimestamp: $.context.timestamp
        bapId: $.context.bap_id
        bapUri: $.context.bap_uri
        bppId: $.context.bpp_id
        bppUri: $.context.bpp_uri
        city_code: $.context.location.city.code
        action_order: $.message.order
      inputs:
        id: select_1_Payload
        jsonSchema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            provider:
              type: object
              description: Provider details
              properties:
                id:
                  type: string
                  description: Enter provider id
                  default: PROVIDER_ID
              required:
                - id
              additionalProperties: false
            items:
              type: array
              description: List of items selected for dedupe
              minItems: 1
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Enter item id
                    default: ITEM_ID_DEDUPE
                required:
                  - id
                additionalProperties: false
            fulfillments:
              type: array
              description: Fulfillment details for dedupe
              minItems: 1
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Enter fulfillment id
                    default: F9
                  type:
                    type: string
                    description: Fulfillment type
                    default: DEDUPE
                  customer:
                    type: object
                    properties:
                      person:
                        type: object
                        properties:
                          dob:
                            type: string
                            format: date
                            description: Customer date of birth
                            default: 1991-11-17
                          creds:
                            type: array
                            description: Customer credentials
                            minItems: 1
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Credential value
                                  default: RKUIS4815T
                                type:
                                  type: string
                                  description: Credential type
                                  default: PAN
                              required:
                                - id
                                - type
                              additionalProperties: false
                        required:
                          - dob
                          - creds
                        additionalProperties: false
                      contact:
                        type: object
                        properties:
                          phone:
                            type: string
                            description: Customer phone number
                            default: +91-9999999999
                          email:
                            type: string
                            format: email
                            description: Customer email address
                            default: john.doe@example.com
                        required:
                          - phone
                          - email
                        additionalProperties: false
                    required:
                      - person
                      - contact
                    additionalProperties: false
                required:
                  - id
                  - type
                  - customer
                additionalProperties: false
          required:
            - provider
            - items
            - fulfillments
          additionalProperties: false
    examples:
      - name: example for select
        payload:
          context:
            domain: ONDC:FIS12:BL
            action: select
            timestamp: 2026-08-14T14:29:08.575Z
            transaction_id: 97c8aa10-3357-4514-ae11-6bf97a72b677
            message_id: b1b2bed6-3545-4f1e-8839-5017f6af167f
            bap_id: bap.example.com
            bap_uri: https://bap.example.com
            ttl: PT30S
            bpp_id: dev-workbench.ondc.tech
            bpp_uri: https://dev-workbench.ondc.tech/api-service/ONDC:FIS12:BL/2.3.0/seller
            version: 2.3.0
            location:
              country:
                code: IND
              city:
                code: "*"
          message:
            order:
              provider:
                id: PROVIDER_ID
              items:
                - id: ITEM_ID_DEDUPE
              fulfillments:
                - id: F9
                  type: DEDUPE
                  customer:
                    person:
                      dob: 1991-11-17
                      creds:
                        - id: RKUIS4815T
                          type: PAN
                    contact:
                      phone: +91-9999999999
                      email: john.doe@example.com
        type: request
        description: The borrower selects the dedupe item.
  - api: on_select
