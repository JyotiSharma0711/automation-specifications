      saveData:
        transactionId: $.context.transaction_id
        latestMessage_id: $.context.message_id
        latestTimestamp: $.context.timestamp
        bapId: $.context.bap_id
        bapUri: $.context.bap_uri
        bppId: $.context.bpp_id
        bppUri: $.context.bpp_uri
        city_code: $.context.location.city.code
        order_payload: $.message.order
        form_id: $.message.order.items[0].xinput.form.id
        single_redirection: $.message.order.items[0].xinput.form.url
      inputs:
        id: on_select_input
        jsonSchema:
          $schema: http://json-schema.org/draft-07/schema#
          type: object
          properties:
            state:
              type: string
              title: State
              description: Select state
              enum:
                - ACCEPTED
                - REJECTED
              default: ACCEPTED
          required:
            - state
          additionalProperties: false
    examples:
      - name: example for on_select
        payload:
          context:
