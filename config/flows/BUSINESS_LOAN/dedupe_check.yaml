  - api: on_search
    action_id: on_Search_1
    owner: BPP
    responseFor: search_1
    unsolicited: false
    description: The Lender responds to the LSP's catalogue search with its currently live Business Loan products -- term loans and credit lines -- along with the document checklist required per product (GST details, Udyam number, etc.). This is the baseline catalogue the LSP caches and periodically refreshes, so a Lender going offline mid-refresh must not leave the LSP holding stale or half-updated product data, and paused products must be distinguishable from discontinued ones.
