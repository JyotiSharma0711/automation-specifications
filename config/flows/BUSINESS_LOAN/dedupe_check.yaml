    responseFor: null
    unsolicited: false
    description: The LSP initiates a lightweight catalogue search for available Business Loan products, carrying only category and location context rather than any borrower-specific data. This lets the LSP discover participating Lenders and refresh its product cache ahead of a borrower session, instead of issuing a full borrower-scoped search on every app open -- discovery results should be treated as incremental since not every Lender responds in the same window.
