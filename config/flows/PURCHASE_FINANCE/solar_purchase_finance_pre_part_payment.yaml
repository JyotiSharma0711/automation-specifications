meta:
  domain: ONDC:FIS12:PF
  version: 2.3.0
  flowId: solar_purchase_finance_pre_part_payment
  config_version: 0.0.0001
  description: "Solar Purchase Finance pre-part payment on ONDC:FIS12:PF, appended to the disbursed base order from solar_purchase_finance_single_redirection. The borrower (LSP) voluntarily pays an extra amount towards the loan via update (update_target: payments, a borrower-entered amount), the lender (Lender) acknowledges with a pending pre-part payment quote (on_update, order ACTIVE) targeting the earliest still-unpaid installment, and finally confirms the pre-part payment as PAID (on_update), deferring that installment since it is now settled through this payment; the loan itself remains ACTIVE. The base order's own unsolicited on_update (already ending the origination flow in the fully-disbursed state) is intentionally not repeated here. Disbursal goes to the merchant's or installer's verified bank account, never to the borrower -- and only once installation is confirmed, so the LSP must not treat loan sanction as equivalent to funds having moved."
  use_case_id: ""
