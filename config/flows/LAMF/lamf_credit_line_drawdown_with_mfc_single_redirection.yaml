meta:
  domain: ONDC:FIS12:SL
  version: 2.3.0
  flowId: lamf_credit_line_drawdown_with_mfc_single_redirection
  config_version: 0.0.0001
  description: A borrower draws down from an already-sanctioned LAMF credit
    line. The provider id and the base credit line order id are entered at
    init, along with the drawdown amount. The borrower raises the drawdown
    (init) on the base order, the lender returns approved drawdown terms and
    requests consent (on_init), the borrower consents (confirm), the lender
    creates the child drawdown order (on_confirm), disburses it (on_update -
    child order) and updates the base order's current utilization (on_update -
    base order).
  use_case_id: ""
