meta:
  domain: ONDC:FIS12:SL
  version: 2.3.0
  flowId: lamf_credit_line_prepart_with_mfc_single_redirection
  config_version: 0.0.0001
  description: A borrower completes the LAMF credit line MFC single redirection
    journey and then makes a pre-part payment on the active credit line. After
    the lender confirms the credit line order (on_confirm), the borrower sends
    the pre-part payment request on the order id (update), the lender returns the
    pre-part payment quote with a payment link (on_update) and then confirms the
    payment success (on_update).
  use_case_id: ""
