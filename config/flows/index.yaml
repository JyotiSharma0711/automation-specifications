        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - issue_open_100
        - on_issue_processing_100
        - issue_status_processing_100
        - on_issue_status_processing_100
        - on_issue_resolved_100
        - issue_close_100
      display:
        actions:
          issue_open_100: Raise an issue or grievance
          on_issue_processing_100: Receive issue raised acknowledgement
          issue_status_processing_100: Check the issue resolution status
          on_issue_status_processing_100: Receive the issue status update
          on_issue_resolved_100: Receive the issue resolution and closure
          issue_close_100: Close the issue
    usecase: Business Loan
    tags:
      - WORKBENCH
      - MANDATORY
    description: BUSINESS Term Loan With File Upload with IGM 1.0.0
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_with_file_upload_with_igm_1.0.0.yaml"

  - type: playground
    id: business_term_loan_with_aa_with_igm_1.0.0
    meta:
      type: SECONDARY
      order: 10
      secondary_of: business_term_loan_with_aa
      hide_actions:
        - search_1
        - on_search_1
        - search_2
        - on_search_2
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - on_status_4
        - on_status_5
        - on_status_6
        - on_status_7
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - issue_open_100
        - on_issue_processing_100
        - issue_status_processing_100
        - on_issue_status_processing_100
        - on_issue_resolved_100
        - issue_close_100
      display:
        actions:
          issue_open_100: Raise an issue or grievance
          on_issue_processing_100: Receive issue raised acknowledgement
          issue_status_processing_100: Check the issue resolution status
          on_issue_status_processing_100: Receive the issue status update
          on_issue_resolved_100: Receive the issue resolution and closure
          issue_close_100: Close the issue
    usecase: Business Loan
    tags:
      - WORKBENCH
