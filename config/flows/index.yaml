  - type: playground
    id: lamf_credit_line_with_mfc_single_redirection
    meta:
      type: PRIMARY
      order: 2
      secondary_flows:
        - lamf_credit_line_with_mfc_single_redirection_with_igm_1.0.0
        - lamf_credit_line_drawdown_with_mfc_single_redirection
        - lamf_credit_line_prepart_with_mfc_single_redirection
        - lamf_credit_line_foreclosure_with_mfc_single_redirection
      display:
        preferred: true
        sections:
          - name: Loan Services Discovery
            actions:
              search_1: Search for Loan Against Mutual Funds services
              on_search_1: Receive LAMF product catalogue
          - name: Offer Selection
            actions:
              select_1: Select a LAMF Credit Line offer
              on_select_1: Receive the LAMF Credit Line offer quote
          - name: Status Updates
            actions:
              on_status_1: Receive loan processing status update
              on_status_2: Receive loan processing status update
              on_status_3: Receive loan processing status update
              on_status_4: Receive loan processing status update
          - name: Loan Processing (Single Redirection)
            actions:
              single_redirection: App-in-App Experience
          - name: Additional Step Required
            actions:
              select_2: Provide additional details for loan processing
              on_select_2: Receive updated loan terms
          - name: Loan Confirmation (Credit Line Creation / Disbursement)
            actions:
              on_confirm_1: Receive the confirmed and disbursed LAMF Credit Line order
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - Mandatory
      - REPORTABLE
    description: LAMF Credit Line with MFC
    config:
      $ref: "./LAMF/lamf_credit_line_with_mfc_single_redirection.yaml"

  - type: playground
    id: lamf_credit_line_with_mfc_single_redirection_with_igm_1.0.0
    meta:
      type: SECONDARY
      order: 3
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - on_status_4
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - issue_open_100
        - on_issue_processing_100
        - issue_status_processing_100
        - on_issue_status_processing_100
        - on_issue_resolved_100
        - issue_close_100
      display:
        actions:
          issue_open_100: Raise an issue or grievance
          on_issue_processing_100: Receive issue raised acknowledgement
          issue_status_processing_100: Check the issue resolution status
          on_issue_status_processing_100: Receive the issue status update
          on_issue_resolved_100: Receive the issue resolution and closure
          issue_close_100: Close the issue
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - Mandatory
    description: LAMF Credit Line with MFC With Issue Grievance and Management 1.0.0
    config:
      $ref: "./LAMF/lamf_credit_line_with_mfc_single_redirection._with_igm_1.0.0.yaml"

  - type: playground
    id: lamf_credit_line_drawdown_with_mfc_single_redirection
    meta:
      type: SECONDARY
      order: 4
      visible_actions:
        - init_1
        - on_init_1
        - confirm_1
        - on_confirm_1
        - on_update_1
        - on_update_2
      display:
        actions:
          init_1: Initiate a drawdown request
          on_init_1: Receive drawdown initiation confirmation
          confirm_1: Confirm the drawdown
          on_confirm_1: Receive drawdown confirmed with disbursement details
          on_update_1: Receive drawdown disbursement status update
          on_update_2: Receive updated credit line account summary
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Drawdown - LAMF Credit Line with MFC"
    config:
      $ref: "./LAMF/lamf_credit_line_drawdown_with_mfc_single_redirection.yaml"

  - type: playground
    id: lamf_credit_line_prepart_with_mfc_single_redirection
    meta:
      type: SECONDARY
      order: 5
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - on_status_4
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - update_1
        - on_update_1
        - on_update_2
      display:
        actions:
          update_1: Request a partial prepayment of the credit line
          on_update_1: Receive prepayment request with payment URL
          on_update_2: Receive prepayment confirmation and revised terms status
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Pre-Part Payment - LAMF Credit Line with MFC"
    config:
      $ref: "./LAMF/lamf_credit_line_prepart_with_mfc_single_redirection.yaml"

  - type: playground
    id: lamf_credit_line_foreclosure_with_mfc_single_redirection
    meta:
      type: SECONDARY
      order: 6
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - on_status_4
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - update_1
        - on_update_1
        - on_update_2
      display:
        actions:
          update_1: Request foreclosure of the credit line
          on_update_1: Receive foreclosure payment request with payment URL
          on_update_2: Receive foreclosure payment confirmation and closure status
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Foreclosure - LAMF Credit Line with MFC"
    config:
      $ref: "./LAMF/lamf_credit_line_foreclosure_with_mfc_single_redirection.yaml"

  - type: playground
    id: lamf_term_loan_with_mfc_single_redirection
    meta:
      type: PRIMARY
      order: 7
      secondary_flows:
        - lamf_term_loan_foreclosure_with_mfc_single_redirection
        - lamf_term_loan_prepart_with_mfc_single_redirection
        - lamf_term_loan_missed_emi_with_mfc_single_redirection
      display:
        preferred: true
        sections:
          - name: Loan Services Discovery
            actions:
              search_1: Search for LAMF Term Loan services
              on_search_1: Receive LAMF Term Loan catalogue
          - name: Offer Selection
            actions:
              select_1: Select a LAMF Term Loan offer
              on_select_1: Receive the LAMF Term Loan offer quote
          - name: Status Updates
            actions:
              on_status_1: Receive loan processing status update
              on_status_2: Receive loan processing status update
              on_status_3: Receive loan processing status update
              on_status_4: Receive loan processing status update
          - name: Loan Processing (Single Redirection)
            actions:
              single_redirection: App-in-App Experience
          - name: Additional Step Required
            actions:
              select_2: Provide additional details for loan processing
              on_select_2: Receive updated loan terms
          - name: Loan Confirmation (Term Loan Disbursement)
            actions:
              on_confirm_1: Receive the confirmed and disbursed LAMF Term Loan order
          - name: Disbursement Status
            actions:
              on_update_1: Receive the term loan disbursement status update
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "LAMF Term Loan with MFC"
    config:
      $ref: "./LAMF/lamf_term_loan_with_mfc_single_redirection.yaml"

  - type: playground
    id: lamf_term_loan_foreclosure_with_mfc_single_redirection
    meta:
      type: SECONDARY
      order: 8
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - on_status_4
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - on_update_1
        - LENDER_UTR_TERM_001
        - update_1
        - on_update_2
        - on_update_3
      display:
        # LENDER_UTR_TERM_001 is not a real action_id in this flow's steps (it's a
        # transaction_id example value) — omitted here, not a display.actions key.
        actions:
          on_update_1: Receive foreclosure settlement amount
          update_1: Request foreclosure of the term loan
          on_update_2: Receive foreclosure payment request with payment URL
          on_update_3: Receive foreclosure payment confirmation and loan closure
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Foreclosure - LAMF Term Loan with MFC"
    config:
      $ref: "./LAMF/lamf_term_loan_foreclosure_with_mfc_single_redirection.yaml"

  - type: playground
    id: lamf_term_loan_prepart_with_mfc_single_redirection
    meta:
      type: SECONDARY
      order: 9
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - on_status_4
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - on_update_1
        - LENDER_UTR_TERM_001
        - update_1
        - on_update_2
        - on_update_3
      display:
        actions:
          on_update_1: Receive prepayment settlement amount
          update_1: Request a partial prepayment of the term loan
          on_update_2: Receive prepayment request with payment URL
          on_update_3: Receive prepayment confirmation and revised loan terms
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Pre-Part Payment - LAMF Term Loan with MFC"
    config:
      $ref: "./LAMF/lamf_term_loan_prepart_with_mfc_single_redirection.yaml"

  - type: playground
    id: lamf_term_loan_missed_emi_with_mfc_single_redirection
    meta:
      type: SECONDARY
      order: 10
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - on_status_4
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - on_update_1
        - LENDER_UTR_TERM_001
        - update_1
        - on_update_2
        - on_update_3
      display:
        actions:
          on_update_1: Receive missed EMI penalty details
          update_1: Request of missed EMI
          on_update_2: Receive missed EMI payment request with payment URL
          on_update_3: Receive missed EMI payment confirmation and account status
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: "Missed EMI - LAMF Term Loan with MFC"
    config:
      $ref: "./LAMF/lamf_term_loan_missed_emi_with_mfc_single_redirection.yaml"

