flows:
  # ════════════════════════════════════════════════════════════════
  # Personal Loan
  # ════════════════════════════════════════════════════════════════

  - type: playground
    id: Personal_Loan_Offline
    meta:
      type: PRIMARY
      order: 2
      secondary_flows:
        - Personal_Loan_Foreclosure_Offline
        - Personal_Loan_missed_emi_payment_Offline
        - Personal_Loan_Pre_Part_Payment_Offline
        - "Personal_Loan_Offline_With_IGM(v-1.0.0)"
      display:
        sections:
          - name: Product Discovery
            actions:
              search_personal_loan_3: Search for Personal Loan products
              on_search_personal_loan_3: Receive Personal Loan product catalogue
          - name: Application Submission
            actions:
              personal_loan_information_form: Submit the Personal Loan application form
          - name: Offer Selection
            actions:
              select_3_personal_loan_3: Select a Personal Loan offer
              on_select_3_personal_loan_3: Receive the Personal Loan offer quote
          - name: Status Updates
            actions:
              on_status_kyc_verification: Receive loan processing status update
              on_status_personal_loan_2: Receive loan processing status update
              on_status_personal_loan_3_order_update: Receive loan processing status update
          - name: Loan Processing
            actions:
              Ekyc_details_verification_status: App-in-App Experience (/callback Handling)
              status_personal_loan_3: Fetching Status
              on_status_personal_loan_order_update: Receive loan processing status update
          - name: Loan Confirmation And Disbursement
            actions:
              confirm_personal_loan_3: Confirm the Personal Loan booking
              on_confirm_personal_loan_3: Receive the confirmed and disbursed Personal Loan order
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A personal loan origination flow enabling borrowers to search, apply, and track their application while lenders perform offline verification and underwriting to deliver a lending decision.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Offline.yaml

  - type: playground
    id: Personal_Loan_Single_Redirection
    meta:
      type: PRIMARY
      order: 1
      secondary_flows:
        - Personal_Loan_Foreclosure_Single_Redirection
        - Personal_Loan_Missed_EMI_Single_Redirection
        - Personal_Loan_Pre_Part_Payment_Single_Redirection
        - "Personal_Loan_Single_Redirection_With_IGM(v-1.0.0)"
      display:
        # Preferred variant — also kept first via order: 1 so it renders
        # first in both the API Reference list and Journey View.
        preferred: true
        sections:
          - name: Product Discovery
            actions:
              search_personal_loan_3: Search for Personal Loan products
              on_search_personal_loan_3: Receive Personal Loan product catalogue
          - name: Application Submission
            actions:
              personal_loan_information_form: Submit the Personal Loan application form
          - name: Offer Selection
            actions:
              select_3_personal_loan_3: Select a Personal Loan offer
              on_select_3_personal_loan_3: Receive the Personal Loan offer quote
          - name: Status Updates
            actions:
              on_status_kyc_verification: Receive loan processing status update
              on_status_latest_order_status: Receive loan processing status update
              on_status_updated_checklists: Receive loan processing status update
              on_status_order_status_checklists: Receive loan processing status update
          - name: Single Redirection (app-in-app experience)
            actions:
              Ekyc_details_verification_status: App-in-App Experience (/callback Handling)
              status_personal_loan_3: Fetching Status
              on_status_personal_loan_3: Receive loan processing status update
          - name: Loan Confirmation And Disbursement
            actions:
              confirm_personal_loan_3: Confirm the Personal Loan booking
              on_confirm_personal_loan_3: Receive the confirmed and disbursed Personal Loan order
          - name: EMI Payment
            actions:
              on_status_installment_1: Receive EMI payment reminders and updates
              on_status_installment_2: Receive EMI payment reminders and updates
              on_status_installment_3: Receive EMI payment reminders and updates
              on_status_installment_4: Receive EMI payment reminders and updates
              on_status_installment_5: Receive EMI payment reminders and updates
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A borrower discovers and selects a personal loan offer within an ONDC marketplace, then completes the full loan origination process—including KYC verification, account validation, mandate setup, and documentation—through seamless single-platform redirection with continuous status updates throughout the application lifecycle.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Single_Redirection.yaml

  - type: playground
    id: Personal_Loan_Dedupe_Check
    meta:
      type: PREREQUISITE
      prerequisite_kind: optional
      order: 3
      display:
        sections:
          - name: Product Discovery
            actions:
              search_personal_loan_3: Search for Personal Loan products
              on_search_personal_loan_3: Receive Personal Loan product catalogue
          - name: Dedupe Check
            actions:
              select_3_personal_loan_3: Share borrower details for the dedupe check
              on_select_3_personal_loan_3: Receive the dedupe check outcome
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: The Dedupe Check is used to verify whether a borrower already has an existing loan application with a lender.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Dedupe_Check.yaml

  # ── Personal Loan Offline secondaries ─────────────────────────────

  - type: playground
    id: Personal_Loan_Foreclosure_Offline
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Offline   # fallback only — parent's secondary_flows is authoritative
      visible_actions:
        - update_personal_loan_3
        - on_update_foreclosure_pl
        - payment_url_form
        - on_update_foreclosure_unsolicitated
      display:
        actions:
          update_personal_loan_3: Request foreclosure of the Personal Loan
          on_update_foreclosure_pl: Receive foreclosure request with payment URL
          payment_url_form: Payment Link Redirection
          on_update_foreclosure_unsolicitated: Receive foreclosure payment confirmation and loan closure status
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: Enables borrowers to request and process early settlement of a personal loan through offline channels, incorporating lender verification and official account closure.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Foreclosure_Offline.yaml

  - type: playground
    id: Personal_Loan_missed_emi_payment_Offline
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Offline
      visible_actions:
        - update_personal_loan_3
        - on_update_missed_emi_pl
        - payment_url_form
        - on_update_missed_emi_unsolicitated
      display:
        actions:
          update_personal_loan_3: Request of missed EMI
          on_update_missed_emi_pl: Receive missed EMI payment request with payment URL
          payment_url_form: Payment Link Redirection
          on_update_missed_emi_unsolicitated: Receive missed EMI payment confirmation and account updated status
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A borrower settles a missed personal loan EMI payment offline, including applicable penalties, while the lender validates the settlement and updates the loan account status.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Missed_EMI_Offline.yaml

  - type: playground
    id: Personal_Loan_Pre_Part_Payment_Offline
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Offline
      visible_actions:
        - update_personal_loan_3
        - on_update_pre_part_payment_pl
        - payment_url_form
        - on_update_unsolicitated
      display:
        actions:
          update_personal_loan_3: Request a partial prepayment of the Personal Loan
          on_update_pre_part_payment_pl: Receive prepayment request with payment URL
          payment_url_form: Payment Link Redirection
          on_update_unsolicitated: Receive prepayment payment confirmation and revised loan terms status
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A borrower initiates a partial prepayment of their personal loan principal outside the regular EMI schedule to reduce outstanding debt, with the lender validating the prepayment amount, recalculating revised repayment terms and associated charges, and updating the loan account status upon successful payment completion.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Pre_Part_Payment_Offline.yaml

  - type: playground
    id: "Personal_Loan_Offline_With_IGM(v-1.0.0)"
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Offline
      visible_actions: &igm_actions
        - issue_open_100
        - on_issue_processing_100
        - issue_status_processing_100
        - on_issue_status_processing_100
        - on_issue_resolved_100
        - issue_close_100
      display: &igm_display
        actions:
          issue_open_100: Raise an issue or grievance
          on_issue_processing_100: Receive issue raised acknowledgement
          issue_status_processing_100: Check the issue resolution status
          on_issue_status_processing_100: Receive the issue status update
          on_issue_resolved_100: Receive the issue resolution and closure
          issue_close_100: Close the issue
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A personal loan origination flow enabling borrowers to search, apply, and track their application while lenders perform offline verification and underwriting to deliver a lending decision.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Offline_With_IGM_v-1_0_0_.yaml

  # ── Personal Loan Single Redirection secondaries ──────────────────

  - type: playground
    id: Personal_Loan_Foreclosure_Single_Redirection
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Single_Redirection
      visible_actions:
        - update_personal_loan_3
        - on_update_foreclosure_pl
        - payment_url_form
        - on_update_foreclosure_unsolicitated
      display:
        actions:
          update_personal_loan_3: Request foreclosure of the Personal Loan
          on_update_foreclosure_pl: Receive foreclosure request with payment URL
          payment_url_form: Payment Link Redirection
          on_update_foreclosure_unsolicitated: Receive foreclosure payment confirmation and loan closure status
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: Enables borrowers to request and process early settlement of a personal loan through online channels, incorporating lender verification and official account closure.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Foreclosure_Single_Redirection.yaml

  - type: playground
    id: Personal_Loan_Missed_EMI_Single_Redirection
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Single_Redirection
      visible_actions:
        - update_personal_loan_3
        - on_update_missed_emi_pl
        - payment_url_form
        - on_update_missed_emi_unsolicitated
      display:
        actions:
          update_personal_loan_3: Request of missed EMI
          on_update_missed_emi_pl: Receive missed EMI payment request with payment URL
          payment_url_form: Payment Link Redirection
          on_update_missed_emi_unsolicitated: Receive missed EMI payment confirmation and account updated status
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A borrower settles a missed personal loan EMI payment online, including applicable penalties, while the lender validates the settlement and updates the loan account status.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Missed_EMI_Single_Redirection.yaml

  - type: playground
    id: Personal_Loan_Pre_Part_Payment_Single_Redirection
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Single_Redirection
      visible_actions:
        - update_personal_loan_3
        - on_update_pre_part_payment_pl
        - payment_url_form
        - on_update_unsolicitated
      display:
        actions:
          update_personal_loan_3: Request a partial prepayment of the Personal Loan
          on_update_pre_part_payment_pl: Receive prepayment request with payment URL
          payment_url_form: Payment Link Redirection
          on_update_unsolicitated: Receive prepayment payment confirmation and revised loan terms status
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A borrower initiates a partial prepayment of their personal loan principal outside the regular EMI schedule to reduce outstanding debt, with the lender validating the prepayment amount, recalculating revised repayment terms and associated charges, and updating the loan account status upon successful payment completion.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Pre_Part_Payment_Single_Redirection.yaml

  - type: playground
    id: "Personal_Loan_Single_Redirection_With_IGM(v-1.0.0)"
    meta:
      type: SECONDARY
      secondary_of: Personal_Loan_Single_Redirection
      visible_actions: *igm_actions
      display: *igm_display
    usecase: Personal Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A borrower discovers and selects a personal loan offer within an ONDC marketplace, then completes the full loan origination process—including KYC verification, account validation, mandate setup, and documentation—through seamless single-platform redirection with continuous status updates throughout the application lifecycle.
    config:
      $ref: ./PERSONAL LOAN/Personal_Loan_Single_Redirection_With_IGM_v-1_0_0_.yaml

  # ════════════════════════════════════════════════════════════════
  # Gold Loan
  # ════════════════════════════════════════════════════════════════

  - type: playground
    id: Gold_Loan_Offline
    meta:
      type: PRIMARY
      secondary_flows:
        - Gold_Loan_Offline_with_igm_1.0.0
      display:
        sections:
          - name: Product Discovery
            actions:
              search_gold_loan: Search for Gold Loan products
              on_search_gold_loan_3: Receive Gold Loan product catalogue
          - name: Application Submission
            actions:
              gold_loan_information_form: Submit the Gold Loan application form
          - name: Offer Generation & Selection
            actions:
              select_1: Select a Gold Loan offer
              on_select_1: Receive the Gold Loan offer quote
          - name: Branch Selection
            actions:
              select_2: Select a branch for loan processing
              on_select_2: Receive branch selection confirmation
          - name: Loan Processing
            actions:
              Ekyc_details_verification_status: App-in-App Experience (/callback Handling)
          - name: Status Updates
            actions:
              on_status_kyc_verification: Receive the Gold Loan order status update
              status_gold_loan_3: Fetching Status
              on_status_gold_loan_3: Receive the Gold Loan order status update
              on_status_gold_loan_3_order_update: Receive the Gold Loan order status update
          - name: Loan Confirmation
            actions:
              confirm_gold_loan_3: Confirm the Gold Loan booking
              on_confirm_gold_loan_3: Receive the confirmed Gold Loan order
          - name: EMI Payment
            actions:
              on_status_installment_1: Receive EMI payment reminders and updates
    usecase: Gold Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A gold loan application flow where customers digitally search for loan products, configure their terms, and submit applications online, while lenders conduct offline verification and underwriting with periodic status updates to borrowers until final approval or rejection.
    config:
      $ref: ./GOLD LOAN/Gold_Loan_Offline.yaml

  - type: playground
    id: Gold_Loan_Offline_with_igm_1.0.0
    meta:
      type: SECONDARY
      secondary_of: Gold_Loan_Offline
      visible_actions: *igm_actions
      display: *igm_display
    usecase: Gold Loan
    tags: [WORKBENCH, REPORTABLE]
    description: A gold loan application flow where customers digitally search for loan products, configure their terms, and submit applications online, while lenders conduct offline verification and underwriting with periodic status updates to borrowers until final approval or rejection with Issue Grievance and Management 1.0.0.
    config:
      $ref: ./GOLD LOAN/Gold_Loan_Offline_with_igm_1.0.0.yaml

  # ════════════════════════════════════════════════════════════════
  # Credit Card
  # ════════════════════════════════════════════════════════════════

  - type: playground
    id: Credit_Card
    meta:
      type: PRIMARY
      # Verified against Credit_Card.yaml's real api/action_id sequence (the
      # previous version below used unverified generic api names).
      display:
        sections:
          - name: Product Discovery
            actions:
              search: Search for Credit Card products
              on_search: Receive Credit Card product catalogue
          - name: Application Submission
            actions:
              credit_card_information_form: Submit the Credit Card application form
          - name: Offer Generation & Selection
            actions:
              select: Select a Credit Card offer
              on_select: Receive the Credit Card offer details
          - name: Single Redirection
            actions:
              Ekyc_details_form_cc: App-in-App Experience (/callback Handling)
              on_status_unsolicited: Receive processing status update
          - name: Check Order Status
            actions:
              status_1: Check the Credit Card order status
              on_status_1: Receive the Credit Card order status update
          - name: Order Initialization
            actions:
              init: Initialize the Credit Card order
              on_init: Receive order initialization confirmation
          - name: Order Confirmation
            actions:
              confirm: Confirm the Credit Card order
              on_confirm: Receive the confirmed Credit Card order
          - name: Card Delivery Status
            actions:
              status_2: Check the card delivery status
              on_status_2: Receive the card delivery status update
    usecase: Credit Card
    tags: [WORKBENCH, REPORTABLE]
    description: "A borrower discovers, applies for, and confirms a credit card journey: searching the network for available cards, completing a personal-information application form, selecting a card, completing a KYC form, polling for KYC completion status, initiating and confirming the credit card request, and tracking the final application status."
    config:
      $ref: ./CREDIT CARD/Credit_Card.yaml