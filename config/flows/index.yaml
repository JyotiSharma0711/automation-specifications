flows:
  - type: playground
    id: Purchase_Finance_Single_Redirection_With_AA
    preferred: true
    meta:
      type: PRIMARY
      order: 1
      secondary_flows:
        - Purchase_Finance_Single_Redirection_With_AA_With_IGM(v-1.0.0)
      display:
        sections:
          - name: Product Discovery
            actions:
              search1_purchase_finance: Search for Purchase Finance products
              on_search1_purchase_finance: Receive Purchase Finance product catalogue
          - name: Merchant and Product Details Form
            actions:
              product_details_form: Submit merchant and product details
          - name: Generic Offer Generation
            actions:
              search2_purchase_finance: Request a generic Purchase Finance offer
              on_search2_purchase_finance: Receive the generic Purchase Finance offer
          - name: Personal Details Form
            actions:
              personal_details_information_form: Submit personal details
          - name: Consent Handler for AA
            actions:
              search4_purchase_finance: Search with Account Aggregator consent
              on_search6_purchase_finance: Receive offers using Account Aggregator data
          - name: Personalized Offer Generation
            actions:
              search3_purchase_finance: Request a personalized Purchase Finance offer
              on_search5_purchase_finance: Receive the personalized Purchase Finance offer
          - name: Offer Selection
            actions:
              select_purchase_finance: Select a Purchase Finance offer
              on_select_purchase_finance: Receive the Purchase Finance offer quote
          - name: Update Downpayment
            actions:
              down_payment_form: Update the downpayment amount
          - name: Final Offer Selection
            actions:
              select1_purchase_finance: Confirm the final Purchase Finance offer
              on_select1_purchase_finance: Receive the final offer confirmation
          - name: Loan Processing (Single Redirection)
            actions:
              Ekyc_details_verification_status: App-in-App Experience (/callback Handling)
          - name: Status Updates
            actions:
              on_status_unsolicited: Receive loan processing status update
              status1_finance: Check the loan processing status
              on_status1_finance: Receive the loan processing status update
          - name: Additional Step Required
            actions:
              select2_purchase_finance: Provide additional details for loan processing
              on_select2_purchase_finance: Receive updated loan terms
          - name: Order Initialization
            actions:
              init1_purchase_finance: Initialize the Purchase Finance order
              on_init1_purchase_finance: Receive order initialization confirmation
          - name: Loan Confirmation and Sanctioned
            actions:
              confirm_purchase_finance: Confirm the Purchase Finance booking
              on_confirm_purchase_finance: Receive the confirmed and sanctioned Purchase Finance order
          - name: Product Delivery
            actions:
              update_purchase_finance: Update the product delivery status
              on_update_purchase_finance: Receive product delivery confirmation
          - name: Loan Disbursement in Merchant Account
            actions:
              on_update1_unsolicited_purchase_finance: Receive loan disbursement confirmation to the merchant account
    usecase: Purchase Finance
    tags:
      - WORKBENCH
      - WITH_AA
      - REPORTABLE
    description: A buyer-side purchase finance journey where the participant discovers financing options, is redirected once to an Account Aggregator for consent and data sharing, and then completes lender selection, onboarding, loan initiation, confirmation, and subsequent status updates end to end.
    config:
      $ref: ./PURCHASE FINANCE/Purchase_Finance_Single_Redirection_With_AA.yaml

