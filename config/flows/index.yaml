flows:
  - type: playground
    id: master_search
    meta:
      type: PREREQUISITE
      order: 0
      display:
        actions:
          search_1: Search for Loan Against Mutual Funds services
          on_Search_1: Receive LAMF product catalogue
    usecase: Loan Against Mutual Funds
    tags:
      - WORKBENCH
      - REPORTABLE
    description: Master Search
    config:
      $ref: "./LAMF/master_search.yaml"

  # - type: playground
  #   id: lamf_credit_line_with_mfc_offline_journey
  #   meta:
  #     type: PRIMARY
  #     order: 1
  #   usecase: Loan Against Mutual Funds
  #   tags:
  #     - WORKBENCH
  #     - REPORTABLE
  #   description: LAMF Credit Line with Offline Journey
