flows:
  # ──────────────────────────────────────────────────────────────────
  # Business Loan Flows
  # ──────────────────────────────────────────────────────────────────

  - type: playground
    id: master_search
    meta:
      type: PREREQUISITE
      prerequisite_kind: mandatory
      order: 0
      display:
        actions:
          search_1: Search for Business Loan products
          on_Search_1: Receive Business Loan product catalogue
    usecase: Business Loan
    tags:
      - WORKBENCH
      - MANDATORY
      - REPORTABLE
    description: Master Search
    config:
      $ref: "./BUSINESS_LOAN/master_search.yaml"

  - type: playground
    id: business_term_loan_without_aa
    meta:
      type: PRIMARY
      order: 1
      secondary_flows:
        - business_term_loan_with_offline_online_foreclosure
        - business_term_loan_with_offline_online_missed_emi
        - business_term_loan_with_offline_online_pre_part
        - business_term_loan_without_aa_with_igm_1.0.0
      display:
        preferred: true
        inline:
          - flow: business_term_loan_with_aa
            after_section: Application Submission
            label: Consent Handler for AA
            kind: optional
            skip_sections:
              - Application Submission
              - Offer Selection
              - Status Updates
              - Loan Processing (Single Redirection)
              - Additional Step Required
              - Loan Confirmation
              - Post-Confirmation Status Updates
        sections:
          - name: Application Submission
            actions:
              search_1: Search for Business Loan products
              on_search_1: Receive Business Loan product catalogue
          - name: Offer Selection
            actions:
              select_1: Select a Business Loan offer
              on_select_1: Receive the Business Loan offer quote
          - name: Status Updates
            actions:
              on_status_1: Receive loan processing status update
              on_status_2: Receive loan processing status update
              on_status_3: Receive loan processing status update
          - name: Loan Processing (Single Redirection)
            actions:
              single_redirection: App-in-App Experience (/callback Handling)
          - name: Additional Step Required
            actions:
              select_2: Provide additional details for loan processing
              on_select_2: Receive updated loan terms
          - name: Loan Confirmation
            actions:
              on_confirm_1: Receive the confirmed Business Loan order
    usecase: Business Loan
    tags:
      - WORKBENCH
      - MANDATORY
      - REPORTABLE
    description: BUSINESS Term Loan Without AA
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_without_aa.yaml"

  - type: playground
    id: business_term_loan_with_file_upload
    meta:
      type: PRIMARY
      order: 2
      secondary_flows:
        - business_term_loan_with_offline_online_foreclosure
        - business_term_loan_with_offline_online_missed_emi
        - business_term_loan_with_offline_online_pre_part
        - business_term_loan_with_file_upload_with_igm_1.0.0
      display:
        sections:
          - name: Application Submission
            actions:
              search_1: Search for Business Loan products
              on_search_1: Receive Business Loan product catalogue
          - name: Offer Selection
            actions:
              select_1: Select a Business Loan offer
              on_select_1: Receive the Business Loan offer quote
          - name: Status Updates
            actions:
              on_status_1: Receive loan processing status update
              on_status_2: Receive loan processing status update
              on_status_3: Receive loan processing status update
          - name: Loan Processing (Single Redirection)
            actions:
              single_redirection: App-in-App Experience (/callback Handling)
          - name: Additional Step Required
            actions:
              select_2: Provide additional details for loan processing
              on_select_2: Receive updated loan terms
          - name: Loan Confirmation
            actions:
              on_confirm_1: Receive the confirmed Business Loan order
    usecase: Business Loan
    tags:
      - WORKBENCH
      - MANDATORY
      - REPORTABLE
    description: BUSINESS Term Loan With File Upload
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_with_file_upload.yaml"

  - type: playground
    id: business_term_loan_with_aa
    meta:
      type: PRIMARY
      order: 3
      secondary_flows:
        - business_term_loan_with_offline_online_foreclosure
        - business_term_loan_with_offline_online_missed_emi
        - business_term_loan_with_offline_online_pre_part
        - business_term_loan_with_aa_with_igm_1.0.0
      display:
        sections:
          - name: Application Submission
            actions:
              search_1: Search for Business Loan products
              on_search_1: Receive Business Loan product catalogue
          - name: Consent Handler for AA
            actions:
              search_2: Search with Account Aggregator consent
              on_search_2: Receive offers using Account Aggregator data
          - name: Offer Selection
            actions:
              select_1: Select a Business Loan offer
              on_select_1: Receive the Business Loan offer quote
          - name: Status Updates
            actions:
              on_status_1: Receive loan processing status update
              on_status_2: Receive loan processing status update
              on_status_3: Receive loan processing status update
          - name: Loan Processing (Single Redirection)
            actions:
              single_redirection: App-in-App Experience (/callback Handling)
          - name: Additional Step Required
            actions:
              select_2: Provide additional details for loan processing
              on_select_2: Receive updated loan terms
          - name: Loan Confirmation
            actions:
              on_confirm_1: Receive the confirmed Business Loan order
          - name: Post-Confirmation Status Updates
            actions:
              on_status_4: Receive loan processing status update
              on_status_5: Receive loan processing status update
              on_status_6: Receive loan processing status update
              on_status_7: Receive loan processing status update
    usecase: Business Loan
    tags:
      - WORKBENCH
      - MANDATORY
      - REPORTABLE
    description: BUSINESS Term Loan With AA
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_with_aa.yaml"

  - type: playground
    id: dedupe_check
    meta:
      type: PREREQUISITE
      prerequisite_kind: optional
      order: 4
      display:
        actions:
          select_1: Share borrower details for the dedupe check
          on_select_1: Receive the dedupe check outcome
    usecase: Business Loan
    tags:
      - WORKBENCH
      - MANDATORY
      - REPORTABLE
    description: Dedupe Check
    config:
      $ref: "./BUSINESS_LOAN/dedupe_check.yaml"

  # ──────────────────────────────────────────────────────────────────
  # Business Loan – Servicing Flows
  # ──────────────────────────────────────────────────────────────────

  - type: playground
    id: business_term_loan_with_offline_online_foreclosure
    meta:
      type: SECONDARY
      order: 5
      secondary_of: business_term_loan_with_aa
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - select_2
        - on_select_2
        - init_1
        - on_init_1
        - kyc_form
        - on_status_1
        - init_2
        - on_init_2
        - loan_agreement
        - on_status_2
        - init_3
        - on_init_3
        - confirm_1
        - on_confirm_1
      visible_actions:
        - on_update_1
        - update_1
      display:
        # Only on_update_1/update_1 are in visible_actions, so only those get labels
        # here even though the underlying flow file has more update/on_update steps.
        actions:
          on_update_1: Receive foreclosure settlement amount
          update_1: Request foreclosure of the Business Loan
    usecase: Business Loan
    tags:
      - WORKBENCH
      - REPORTABLE
    description: Business Loan – Term Loan Foreclosure (Offline & Online Journey)
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_with_offline_online_foreclosure.yaml"

  - type: playground
    id: business_term_loan_with_offline_online_missed_emi
    meta:
      type: SECONDARY
      order: 6
      secondary_of: business_term_loan_with_aa
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - select_2
        - on_select_2
        - init_1
        - on_init_1
        - kyc_form
        - on_status_1
        - init_2
        - on_init_2
        - loan_agreement
        - on_status_2
        - init_3
        - on_init_3
        - confirm_1
        - on_confirm_1
      visible_actions:
        - on_update_1
        - update_1
      display:
        actions:
          on_update_1: Receive missed EMI penalty details
          update_1: Request of missed EMI
    usecase: Business Loan
    tags:
      - WORKBENCH
      - REPORTABLE
    description: Business Loan – Term Loan Missed EMI (Offline & Online Journey)
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_with_offline_online_missed_emi.yaml"

  - type: playground
    id: business_term_loan_with_offline_online_pre_part
    meta:
      type: SECONDARY
      order: 7
      secondary_of: business_term_loan_with_aa
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - select_2
        - on_select_2
        - init_1
        - on_init_1
        - kyc_form
        - on_status_1
        - init_2
        - on_init_2
        - loan_agreement
        - on_status_2
        - init_3
        - on_init_3
        - confirm_1
        - on_confirm_1
      visible_actions:
        - on_update_1
        - update_1
      display:
        actions:
          on_update_1: Receive prepayment settlement amount
          update_1: Request a partial prepayment of the Business Loan
    usecase: Business Loan
    tags:
      - WORKBENCH
      - REPORTABLE
    description: Business Loan – Term Loan Pre-Part Payment (Offline & Online Journey)
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_with_offline_online_pre_part.yaml"

  # ──────────────────────────────────────────────────────────────────
  # Business Loan – IGM 1.0.0 Servicing Flows
  # ──────────────────────────────────────────────────────────────────

  - type: playground
    id: business_term_loan_without_aa_with_igm_1.0.0
    meta:
      type: SECONDARY
      order: 8
      secondary_of: business_term_loan_without_aa
      hide_actions:
        - search_1
        - on_search_1
        - select_1
        - on_select_1
        - on_status_1
        - on_status_2
        - on_status_3
        - single_redirection
        - select_2
        - on_select_2
        - on_confirm_1
      visible_actions:
        - issue_open_100
        - on_issue_processing_100
        - issue_status_processing_100
        - on_issue_status_processing_100
        - on_issue_resolved_100
        - issue_close_100
      display:
        actions:
          issue_open_100: Raise an issue or grievance
          on_issue_processing_100: Receive issue raised acknowledgement
          issue_status_processing_100: Check the issue resolution status
          on_issue_status_processing_100: Receive the issue status update
          on_issue_resolved_100: Receive the issue resolution and closure
          issue_close_100: Close the issue
    usecase: Business Loan
    tags:
      - WORKBENCH
      - MANDATORY
    description: BUSINESS Term Loan Without AA with IGM 1.0.0
    config:
      $ref: "./BUSINESS_LOAN/business_term_loan_without_aa_with_igm_1.0.0.yaml"

  - type: playground
