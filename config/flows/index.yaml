      order: 2
      secondary_flows:
        - business_term_loan_with_offline_online_foreclosure
        - business_term_loan_with_offline_online_missed_emi
        - business_term_loan_with_offline_online_pre_part
        - business_term_loan_with_file_upload_with_igm_1.0.0
    usecase: Business Loan
